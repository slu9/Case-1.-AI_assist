[project]
name = "campaign-assistant"
version = "0.1.0"
description = "AI-ассистент заведения рекламных кампаний (хакатон SibКод, кейс 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "gigachat>=0.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
